spring.application.name=backend

# Redis config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# PostgreSQL config (Render/local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/celticket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:celticket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:celticket}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Example (In production use a strong injected env var)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000
security.allow-unsigned-session-id=false

# Wompi (usa variables de entorno para credenciales)
wompi.base-url=https://sandbox.wompi.co/v1
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.currency=COP
wompi.redirect-url=${WOMPI_REDIRECT_URL:http://localhost:5500/payment-result.html}

# Pricing dinámico por sección
payments.default-seat-price=20000
payments.service-fee=0
