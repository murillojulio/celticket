spring.application.name=backend

# Redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# MySQL config (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/celticket?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Example (In production use a strong injected env var)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Wompi (usa variables de entorno para credenciales)
wompi.base-url=https://sandbox.wompi.co/v1
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.currency=COP
wompi.redirect-url=http://localhost:5500/payment-result.html

# Pricing dinámico por sección
payments.default-seat-price-cents=20000
payments.service-fee-cents=0
